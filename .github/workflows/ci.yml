name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codingprep_test
          POSTGRES_USER: codingprep_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "False"
          DB_NAME: codingprep_test
          DB_USER: codingprep_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: dummy-key-for-ci
        run: python manage.py check

      - name: Run migrations (validates migration chain)
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "False"
          DB_NAME: codingprep_test
          DB_USER: codingprep_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: dummy-key-for-ci
        run: python manage.py migrate

      - name: Run backend tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "False"
          DB_NAME: codingprep_test
          DB_USER: codingprep_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: dummy-key-for-ci
        run: python manage.py test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file backend/.env.example --profile sandbox config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t codingprep-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t codingprep-frontend-ci ./frontend

      - name: Build Python sandbox image
        run: docker build -t codingprep-sandbox-python ./backend/sandbox/python

      - name: Build Java sandbox image
        run: docker build -t codingprep-sandbox-java ./backend/sandbox/java

      - name: Build C sandbox image
        run: docker build -t codingprep-sandbox-c ./backend/sandbox/c
